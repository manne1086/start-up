services:
  - type: web
    name: ventureforge-backend
    runtime: docker
    dockerfilePath: ./ventureforge-backend/Dockerfile
    dockerContext: ./ventureforge-backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ventureforge-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PRESENTATIONS_AI_API_KEY
        sync: false
      - key: PRESENTATIONS_AI_BASE_URL
        value: https://api.presenton.ai
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: ventureforge-db
    plan: free
    postgresMajorVersion: 16
